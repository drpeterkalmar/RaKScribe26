name: Tests

# Offline-Gates (Gutachten 05.10.2026, P2-12e): laufen bei jedem Push und Pull-Request, ohne Netz-/Gemini-Aufrufe.
# Der Pages-Deploy (deploy.yml) startet erst, wenn dieser Workflow auf main grün ist.
# Node 24: die .mjs-Tests importieren TypeScript direkt (Type-Stripping) — Node 20 kann das nicht.
on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web_app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Web-Abhängigkeiten
        working-directory: web_app
        run: npm ci
      - name: Python-Abhängigkeiten (EXE-Ablauftest)
        run: pip install numpy

      - name: Regeln (PY + TS)
        run: python befund_regeln_test.py
      - name: Fehlhör-Liste (PY + TS)
        run: python misheard_test.py
      - name: Normalbefund-Bypass (PY + TS)
        run: python normal_bypass_test.py
      - name: Normalbefunde, Erkennung, Titel
        run: python test_normalbefunde.py
      - name: Gemini-Antworten zusammensetzen
        run: python test_parts_join.py
      - name: Vorlagen erreichbar (EXE = Web)
        run: python vorlagen_erreichbar_test.py
      - name: EXE-Zustandsmaschine (F10/F9, Generationsnummer)
        run: python tests/offline/test_jobstate.py
      - name: EXE-Aufnahme getrennt von der Live-Anzeige
        run: python tests/offline/test_capture.py
      - name: EXE-Konfiguration (config.ini)
        run: python tests/offline/test_config.py
      - name: EXE-Schlüssel (Praxis-Schlüssel, Token-Cache)
        run: python tests/offline/test_keys.py
      - name: Spracherkennung EXE (chirp_3, Segmente, Stitch = Web)
        run: python tests/offline/test_stt.py
      - name: EXE-Mehr-Regionen-Befund
        run: python tests/offline/test_regionen.py
      - name: EXE-Ablauf (Aufnahme → Befund → Einfügen, mit Attrappen)
        run: python tests/offline/test_exe_ablauf.py
      - name: EXE-Zwischenablage (Wiederholung, Gegenlesen)
        run: python tests/offline/test_clipboard.py
      - name: Web-Pipeline (Abbruch, Fehlerweitergabe, kein Whisper auf Pages)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings pipeline_test.mjs
      - name: Web-Audio (16 kHz im Callback = alter Weg, Byte für Byte)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings audio_test.mjs
      - name: Typprüfung Web
        working-directory: web_app
        run: npx tsc -p tsconfig.app.json --noEmit
