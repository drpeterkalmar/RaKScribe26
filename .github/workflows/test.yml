name: Tests

# Offline-Gates (Gutachten 05.10.2026, P2-12e): laufen bei jedem Push und Pull-Request, ohne Netz-/Gemini-Aufrufe.
# Der Pages-Deploy (deploy.yml) startet erst, wenn dieser Workflow auf main grün ist.
# Node 24: die .mjs-Tests importieren TypeScript direkt (Type-Stripping) — Node 20 kann das nicht.
on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web_app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Web-Abhängigkeiten
        working-directory: web_app
        run: npm ci
      - name: Python-Abhängigkeiten (EXE-Ablauftest, Workflow-Prüfung)
        run: pip install numpy pyyaml soundfile

      - name: Regeln (PY + TS)
        run: python tests/offline/befund_regeln_test.py
      - name: Fehlhör-Liste (PY + TS)
        run: python tests/offline/misheard_test.py
      - name: Chirp-Warnung → Kanban (Mac-Weg, Hochrechnung ab erstem Zähltag)
        run: python tests/offline/test_chirp_warnung.py
      - name: Normalbefund-Bypass (PY + TS)
        run: python tests/offline/normal_bypass_test.py
      - name: Normalbefunde, Erkennung, Titel
        run: python tests/offline/test_normalbefunde.py
      - name: Gemini-Antworten zusammensetzen
        run: python tests/offline/test_parts_join.py
      - name: Ordi-Textbausteine (EXE = Web)
        run: python tests/offline/test_ordi_bausteine.py
      - name: Vorlagen erreichbar (EXE = Web)
        run: python tests/offline/vorlagen_erreichbar_test.py
      - name: EXE-Zustandsmaschine (F10/F9, Generationsnummer)
        run: python tests/offline/test_jobstate.py
      - name: EXE-Aufnahme getrennt von der Live-Anzeige
        run: python tests/offline/test_capture.py
      - name: EXE Audio laden + WAV-Modus (Audio-Datei statt Mikrofon)
        run: python tests/offline/test_audiodatei.py
      - name: EXE-Konfiguration (config.ini)
        run: python tests/offline/test_config.py
      - name: EXE-Schlüssel (Praxis-Schlüssel, Token-Cache)
        run: python tests/offline/test_keys.py
      - name: Spracherkennung EXE (chirp_3, Segmente, Stitch = Web)
        run: python tests/offline/test_stt.py
      - name: Gemini-Aufruf EXE (Request, Wiederholung, 401)
        run: python tests/offline/test_gemini.py
      - name: Befund-Kette EXE (pipeline = prod_pipeline)
        run: python tests/offline/test_pipeline_exe.py
      - name: EXE-Mehr-Regionen-Befund
        run: python tests/offline/test_regionen.py
      - name: Mehrere Untersuchungen ohne Seite (LWS + Becken, Georg 19.11.2026)
        run: python tests/offline/test_mehrfach_seitenlos.py
      - name: Rho ≥ 7 → Osteopenischer Knochenaspekt (Georg 22.11.2026)
        run: python tests/offline/test_rho_osteopen.py
      - name: Rho-Überschrift + Nummerierung (Georg 22.11.2026, Punkt 47 RH 49)
        run: python tests/offline/test_rho_titel_nummer.py
      - name: Georg 22./23.11. Punkte 48–70 (Schulter, Ergebnis, KOALA aus, Gerüst bleibt, Kombi per Diktat)
        run: python tests/offline/test_schulter_ergebnis.py
      - name: EXE-Import ohne Seiteneffekte (UI + main)
        run: python tests/offline/test_import.py
      - name: Toter Code bleibt weg, Prompt-Hinweis einmal
        run: python tests/offline/test_toter_code.py
      - name: Protokoll begrenzt, ohne Diktatinhalt
        run: python tests/offline/test_logging.py
      - name: Deploy-Schutz gegen Schlüssel im Pages-Bundle
        run: python tests/offline/test_deploy_guard.py
      - name: Versionsnummer nur in VERSION, Build-Pakete fest
        run: python tests/offline/test_version_sync.py
      - name: Produktname KaiScribe (sichtbar), technische Namen unverändert
        run: python tests/offline/test_produktname.py
      - name: EXE-Bau am Büro-PC (gleiche PyInstaller-Argumente, kein anonymer GitHub-Abruf)
        run: python tests/offline/test_buero_bau.py
      - name: EXE-Ablauf (Aufnahme → Befund → Einfügen, mit Attrappen)
        run: python tests/offline/test_exe_ablauf.py
      - name: EXE-Zwischenablage (Wiederholung, Gegenlesen)
        run: python tests/offline/test_clipboard.py
      - name: Nur-Text-Modus (Call 0 wie Web, kein Befund)
        run: python tests/offline/test_nur_text.py
      - name: Diktat an der Cursor-Stelle in den Befund einfügen
        run: python tests/offline/test_einfuegen.py
      - name: Befundfeld nie still überschreiben (Ergänzung, Clear all, Reset, Restructure, Strg+Z — PY = TS) (3.19.16)
        run: python tests/offline/test_befundfeld.py
      - name: Markierung im Befund wird durch das Diktat ersetzt (RH 156/165, kaiscribe-sammel-2311)
        run: python tests/offline/test_markierung.py
      - name: Ursulas Durchsicht 20.11.2026 (Ganzbein-Seite laut CAS, keine leere Überschrift, Ergebnis ohne Leerzeile, HWS ohne Seite, %ig)
        run: python tests/offline/test_ursula_2011.py
      - name: Befund aus getipptem/eingefügtem Text
        run: python tests/offline/test_befund_aus_text.py
      - name: SpeechMike (Tasten, LEDs, Zustände — PY + TS, gleiche Fälle)
        run: python tests/offline/test_speechmike.py
      - name: SpeechMike-Ablauf EXE (Pause, INS, EOL, Nur Text, Fensterziel)
        run: python tests/offline/test_speechmike_ablauf.py
      - name: CAS-Auftrag der RaKScribe-Brücke (EOL als Datei, Testbefund, zweiter Auftrag, Widerruf)
        run: python tests/offline/test_cas_auftrag.py
      - name: Bereitschaft (Autostart-Starter, Einzelinstanz, minimiert warten, nach CAS-EOL minimieren)
        run: python tests/offline/test_bereitschaft.py
      - name: Namens-Umzug RaKScribe → KaiScribe (Benutzer-Ordner kopieren, Schlüssel-Rückfall, X:\KaiScribe vor X:\RaKScribe)
        run: python tests/offline/test_umzug.py
      - name: CAS-Leistungen (Vorlagenwahl mit CAS-Hinweis, gemischte Diktate, Hinweise, Band, Bestätigung nach EOL)
        run: python tests/offline/test_cas_leistungen.py
      - name: IB-Lab-Bausteine (Zuordnung, Einsetzen nach der KI, Doppelung, Widerspruch, Messwert-Gate, Band, Knopf)
        run: python tests/offline/test_ibl_bausteine.py
      - name: IB Lab FROG – fester Fuß-Text (10 echte Fälle + Beispielbild, Vorfuß, Sprunggelenk, Diktat, neue Fassung) (v3.19.8)
        run: python tests/offline/test_ibl_frog_text.py
      - name: IB Lab FROG kommt in den Befund – auch mit älterer Brücke (Fall 19.11., einseitig/beidseits/Vorfuß, HIPPO)
        run: python tests/offline/test_ibl_frog_einsetzen.py
      - name: Georgs Diktiertag 20.11.2026 (Anmerkung-Block, FROG ohne Diagnose, RBfracture nur Hinweis, Rho am Schluss, Befundanfang)
        run: python tests/offline/test_georg_2011.py
      - name: Georgs Diktiertag 20.11.2026 – Bedienung (Nur Text bei neuem Auftrag aus, bereits diktiert, Rückfrage + Rückgängig)
        run: python tests/offline/test_georg_2011_ui.py
      - name: Opus-Senf als Hinweis im Fenster (nur kp, je Status, kopierbar nur auf Aktion, Befund/EOL ohne Senf, kein Hänger)
        run: python tests/offline/test_senf_anzeige.py
      - name: Senf + auffällige IB-Lab-Sätze ins SpeechMagic-Fenster (nur kp, einmal je Nr., nie während Aufnahme, Cursor/Zwischenablage zurück, SENF-Warnung)
        run: python tests/offline/test_sm_einfuegen.py
      - name: SpeechMagic-Wächter überlebt „Fenster zu“ (kp unsichtbar weiter, F9/F10 + SpeechMike frei, neue EXE/Freigabe weg → Ende, rg wie bisher)
        run: python tests/offline/test_sm_waechter_bleibt.py
      - name: IB Lab LAMA + FROG ohne Normbereiche (10+10 echte Fälle, älterer Abholer bereinigt) (v3.19.9)
        run: python tests/offline/test_ibl_ohne_norm.py
      - name: IB Lab KOALA → Kniebefund nach K&L-Tabelle (Georgs Fixtures Nr. 34/50, ganze EXE-Kette)
        run: python tests/offline/test_ibl_koala_text.py
      - name: IB Lab PANDA → Knochenalter als Ergebnisbefund (3 echte Fälle, retardiert, akzeleriert, NaN, hand2, EXE-Kette)
        run: python tests/offline/test_ibl_panda_text.py
      - name: IB Lab HIPPO – Becken-/Hüft-Text (Georg 18.11.2026)
        run: python tests/offline/test_ibl_hippo_text.py
      - name: IB Lab SQUIRREL – Skoliose-Text, Vorrang Diktat, Achsensatz (Georg/Peter 20.11.2026)
        run: python tests/offline/test_ibl_squirrel_text.py
      - name: Ganzwirbelsäule mit Seitaufnahme → Gesamte Wirbelsäule (CAS-Leistung, Stichwort, SQUIRREL, GWS + Becken)
        run: python tests/offline/test_gws_seitlich.py
      - name: GWS a.p.-Normaltext ohne Skoliose (Peter 20.11.2026, #459) – ohne/mit Diktat, mit SQUIRREL
        run: python tests/offline/test_gws_ap_normaltext.py
      - name: Nie eine DEXA-Vorlage (Kombi Rö/US + DEXA, reine DEXA) + Platzhalter-Wächter (kaiscribe-dexa-doppelt-rh60-n1)
        run: python tests/offline/test_dexa_doppelt.py
      - name: Befund-KI-Weiche ohne Gemini-Rückfall (zweiter Claude-Versuch, dann ohne KI; Handschalter gemini) (kaiscribe-ohne-gemini-n1)
        run: python tests/offline/test_llm_anbieter.py
      - name: EXE-Ablauf ohne KI (zweimal Frist → Diktat unverändert + rote Prüfzeile, nichts eingefügt, kein Gemini) (kaiscribe-ohne-gemini-n1)
        run: python tests/offline/test_ohne_ki_ui.py
      - name: Nutzungszähler + Tagesbericht (ohne KI je Rolle/Grund, Zweitversuche) (kaiscribe-ohne-gemini-n1)
        run: python tests/offline/test_nutzung.py
      - name: Regel-Register (jede freigegebene Befundregel mit Wortlaut in Prompt/Validator/Regeln, Skill 1–13/3a–3af)
        run: python tests/offline/test_regel_register.py
      - name: Kontext aus der Datenbank des RIS + IB-Lab-Gerüst vor dem Diktat (v3.14.0)
        run: python tests/offline/test_cas_kontext.py
      - name: Mammo-Maske (Vorbefund zerlegen, „unverändert“, ACR/BI-RADS, Befund, Datenschutz, Tasten) (v3.15.0)
        run: python tests/offline/test_maske.py
      - name: Mammo-Maske im EXE-Ablauf (Feldsprung, Diktat je Feld, Warnung, INS, EOL, F4, Rückfall) (v3.15.0)
        run: python tests/offline/test_maske_ablauf.py
      - name: Live-Anzeige aus für kp (kein Streaming, keine Pausen-Reparatur, Rückfall chirp_3, Einfügen rechts, Maske)
        run: python tests/offline/test_live_anzeige_aus.py
      - name: Harter Tagesdeckel Spracherkennung (Zähler, Tageswechsel Wien, Schleifenbremse, Grenze → kein Aufruf + WAV, Meldeweg) (kaiscribe-stt-tagesdeckel-n1)
        run: python tests/offline/test_stt_tagesdeckel.py
      - name: Live-Anzeige nur über EU-Endpunkt eu-speech (Rückfall-Schutz kein globaler Host, SpeechClient client_options) (kaiscribe-live-anzeige-eu-n1)
        run: python tests/offline/test_live_eu.py
      - name: Widerspruchs-Matrix (v3.15.5, alle Skelett-Vorlagen × Befund-Kategorien, EXE = Web)
        run: python tests/offline/widerspruch_matrix_test.py
      - name: Web-Pipeline (Abbruch, Fehlerweitergabe, kein Whisper auf Pages)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings pipeline_test.mjs
      - name: Web-SpeechMike (WebHID-Verbindung, Dekodierung = EXE)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings speechmike_test.mjs
      - name: Web-Audio (16 kHz im Callback = alter Weg, Byte für Byte)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings audio_test.mjs
      - name: Web-Befund-KI (Claude maskiert, gezählter Rückfall, Schlüssel aus Drive nachladen)
        working-directory: web_app
        run: node --experimental-strip-types --no-warnings llm_anbieter_test.mjs
      - name: Typprüfung Web
        working-directory: web_app
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint Web (Gutachten P2-15)
        working-directory: web_app
        run: npx eslint src --max-warnings=0
