name: Debug STT Secret
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        shell: bash
        run: |
          echo "rawlen=${#STT_KEY_B64}"
          # erstes Zeichen prüfen (erlaubt A-Za-z0-9+/=)
          FIRST=$(printf '%s' "$STT_KEY_B64" | cut -c1)
          echo "firstchar=$FIRST"
          # ASCII-Werte der ersten 4 Zeichen
          printf '%s' "$STT_KEY_B64" | head -c 4 | od -c | head -2
          # Decode-Versuch mit -i statt Pipe
          printf '%s' "$STT_KEY_B64" | base64 -d > /tmp/t.json 2>/tmp/t.err || cat /tmp/t.err
          wc -c /tmp/t.json 2>/dev/null
          head -c 40 /tmp/t.json 2>/dev/null; echo
        env:
          STT_KEY_B64: ${{ secrets.STT_KEY_B64 }}
