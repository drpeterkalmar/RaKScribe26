name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Berechtigungen für GITHUB_TOKEN zur Bereitstellung auf GitHub Pages festlegen
permissions:
  contents: read
  pages: write
  id-token: write

# Ein einzelnes Concurrent Deployment erlauben
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web_app/package-lock.json

      - name: Abhängigkeiten installieren
        run: |
          cd web_app
          npm ci

      - name: Web-App bauen
        run: |
          cd web_app
          npm run build

      - name: SECURITY - no key files in Pages bundle
        run: |
          # Keys duerfen NICHT auf GitHub Pages landen (public repo!). Schluessel kommen nur per Praxis-Key-Datei
          # im Browser (Drag & Drop / Menue). v3.2.3 (Gutachten P2-11): Build ABBRECHEN statt einzelne Namen loeschen.
          if grep -rlE "PRIVATE KEY-----(\\n|[[:space:]])*[A-Za-z0-9+/]{40}|\"private_key\"[[:space:]]*:|AQ\.[A-Za-z0-9_-]{20,}" web_app/dist; then
            echo "::error::Schluesselmaterial im Pages-Bundle gefunden - Deploy abgebrochen"; exit 1
          fi
          if ls web_app/dist | grep -iE "key|cred|secret"; then
            echo "::error::Schluesseldatei im Pages-Bundle - Deploy abgebrochen"; exit 1
          fi
          echo "dist listing:" && ls web_app/dist | head -20
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4

      - name: Build-Ordner hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web_app/dist'

      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
