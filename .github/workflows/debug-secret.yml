name: Debug Secret
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        shell: bash
        run: |
          echo "len=${#VERTEX_API_KEY}"
          echo "b64len=$(echo -n "$VERTEX_API_KEY" | base64 | wc -c)"
          if [ -n "$VERTEX_API_KEY" ]; then echo "prefix=${VERTEX_API_KEY:0:3}..."; fi
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
