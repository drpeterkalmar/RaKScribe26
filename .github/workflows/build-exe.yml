name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.8.0). Leave empty to auto-increment from source.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter keyboard markdown numpy openai pillow pyperclip pywin32 sounddevice google-cloud-speech google-api-core grpcio-status

      - name: Build EXE with PyInstaller
        working-directory: source_code
        run: |
          pyinstaller --onefile --noconsole --name=rakscribe26 --icon=../rakscribe.ico --hidden-import=google.cloud.speech --hidden-import=google.cloud.speech_v2 --collect-all google --collect-all grpc RaKScribe.py
          Get-ChildItem dist

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp source_code/dist/rakscribe26.exe release/
          cp config.ini release/
          cp templates.json release/
          cp radiology_prompt.txt release/
          # SECURITY (03.09.26): KEINE Key-Dateien mehr in Release-Assets (public repo!).
          # Verteilung der Keys nur ueber den privaten Drive-Ordner RaKScribe.
          # vertex-key.b64 / rakscribe-stt-key.b64 liegen im Drive → neben die EXE kopieren.

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v2.9.10" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RaKScribe26 ${{ steps.version.outputs.tag }}
          files: release/*
          draft: false
          prerelease: false
