name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Tag (z. B. 3.2.4). Leer = Test-Build als Vorabversion test-<Lauf-Nr.>'
        required: false
        default: ''
      release:
        description: 'Ohne Tag: Release mit der Version aus der Datei VERSION veröffentlichen'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        working-directory: source_code
        run: |
          pyinstaller --onefile --noconsole --name=rakscribe26 --icon=../rakscribe.ico --hidden-import=google.cloud.speech --hidden-import=google.cloud.speech_v2 --collect-all google --collect-all grpc --hidden-import=misheard --hidden-import=befund_regeln --hidden-import=normalbypass --hidden-import=jobstate --hidden-import=pipeline --hidden-import=aufnahme --hidden-import=config --hidden-import=keys --hidden-import=detect --hidden-import=stt --hidden-import=gemini --hidden-import=clipboard_win --add-data "../misheard_words.json;." --add-data "../radiology_prompt.txt;." --add-data "../templates.json;." --add-data "../vorlagen_vorrang.json;." --add-data "../phrases.json;." --add-data "../VERSION;." RaKScribe.py
          Get-ChildItem dist

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp source_code/dist/rakscribe26.exe release/
          # v3.2.2 (Peter 05.10.): NUR die EXE ausliefern — Vorlagen, Prompt und Fehlhör-Liste sind eingebaut,
          # config.ini legt die EXE beim ersten Start selbst an. Keine Extradateien mehr zum Herunterladen.
          # SECURITY (03.09.26): KEINE Key-Dateien mehr in Release-Assets (public repo!).
          # Verteilung der Keys nur ueber den privaten Drive-Ordner RaKScribe.
          # Einziger Schluessel: rakscribe-praxis-key.json (Drive) → in der EXE per Menue laden (v3.2.3).

      - name: Determine version
        id: version
        shell: bash
        run: |
          # Umbau Schritt 21 (Gutachten P2-12): ein manueller Lauf ohne Tag überschreibt KEIN bestehendes Release mehr,
          # sondern erzeugt eine Vorabversion test-<Lauf-Nr.>. Die Versionsnummer steht nur noch in der Datei VERSION.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.release }}" = "true" ]; then
            echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-${{ github.run_id }}" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RaKScribe26 ${{ steps.version.outputs.tag }}
          files: release/*
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
