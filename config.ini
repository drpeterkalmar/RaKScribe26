[SETTINGS]
# Befund-KI: gemini = Gemini 3.5 Flash über Vertex AI am EU-Endpoint (Modell und Endpoint sind fest eingebaut).
# Der Schlüssel kommt ausschließlich aus rakscribe-praxis-key.json — nicht hier eintragen.
LLM_PROVIDER = gemini
LLM_MODEL = gemini-3.5-flash
# Anbieter der Befund-KI: gemini (Standard) | anthropic (Claude direkt bei Anthropic, Text vorher maskiert;
# Ausfall/Zeitüberschreitung/unvollständige Rückmaskierung → automatisch Gemini). Nur nach Peters Go umstellen.
# Anthropic-Schlüssel: Feld "anthropic_api_key" in rakscribe-praxis-key.json.
LLM_ANBIETER = gemini
# LLM_ANBIETER_KORREKTUR = anthropic   (nur Call 0 / Nur-Text-Korrektur; leer = wie LLM_ANBIETER)
ANTHROPIC_MODELL = claude-haiku-5-5
ANTHROPIC_FRIST = 20
