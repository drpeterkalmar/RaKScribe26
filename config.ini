[SETTINGS]
# Befund-KI: gemini = Gemini 3.5 Flash über Vertex AI am EU-Endpoint (Modell und Endpoint sind fest eingebaut).
# Der Schlüssel kommt ausschließlich aus kaiscribe-praxis-key.json (Rückfall rakscribe-praxis-key.json) — nicht hier eintragen.
LLM_PROVIDER = gemini
LLM_MODEL = gemini-3.5-flash
# Anbieter der Befund-KI: anthropic (Standard seit 16.11.2026, Peters Go 14.11.: Claude Sonnet 5.5 direkt bei Anthropic,
# Text vorher maskiert) | gemini (Handschalter, Notfall).
# Anthropic-Schlüssel: Feld "anthropic_api_key" in kaiscribe-praxis-key.json.
LLM_ANBIETER = anthropic
# LLM_ANBIETER_KORREKTUR = anthropic   (nur Call 0 / Nur-Text-Korrektur; leer = wie LLM_ANBIETER)
ANTHROPIC_MODELL = claude-sonnet-5-5
ANTHROPIC_FRIST = 45
# Kein Gemini-Rückfall (Peter 23.11.2026): Ausfall/Zeitüberschreitung/Maskierungsfehler → Claude ein zweites Mal, dann
# ohne KI (Diktat unformatiert ins Befundfeld + rote Prüfzeile, Call 0 = Rohtext). KI_RUECKFALL = an = alter Weg (→ Gemini).
KI_RUECKFALL = aus
# Opus-Senf als schreibgeschützter Hinweis beim Öffnen eines CAS-Diktats (kaiscribe-senf-anzeige-n1, Peter 20.11.2026):
# nur für diese Kürzel (Standard kp; aus = niemand). Ablage der VM, nur lesend; fehlt sie, bleibt das Feld aus.
# SENF_ANZEIGE = kp
# SENF_ORDNER = X:\RaKScribe\Daten\senf
# Senf bzw. auffällige IB-Lab-Sätze automatisch ins SpeechMagic-Diktatfenster (senf-ibl-speechmagic-paste-n1, Peter
# 21.11.2026): nur für diese Kürzel (Standard kp; aus = niemand), getrennt für Senf und IB Lab. Wirkt nur, solange im
# Brücken-Ordner auf X: speechmagic_einfuegen_an.txt liegt (Notschalter: speechmagic_einfuegen_aus.txt).
# SM_SENF = kp
# SM_IBL = kp
# Senf steht befundtauglich mit kurzer Marke [SENF] davor; „Übernehmen“ (diese Taste) entfernt nur die Marken im offenen
# Diktat. Eine freie SpeechMike-Taste kann in SpeechControl auf diese Tastenkombination gelegt werden. aus = keine Taste.
# SM_UEBERNEHMEN_TASTE = ctrl+alt+s
# Live-Anzeige (zweite Google-Erkennung während der Aufnahme) aus für diese Kürzel (kaiscribe-live-anzeige-aus-kp-n1,
# Peter 24.11.2026): kein Google-Streaming, keine Reparatur je SpeechMike-Pause; links nur „● Aufnahme läuft“, der Text
# kommt nach Stopp/INS aus chirp_3. Standard kp; aus = niemand (alle wieder mit Live-Anzeige = Rollback).
# LIVE_ANZEIGE_AUS = kp
# Harter Tagesdeckel Google-Spracherkennung (kaiscribe-stt-tagesdeckel-n1, Peter 24.11.2026): höchstens so viele Minuten
# Audio je PC und Tag (chirp_3 + Live-Anzeige, Wiederholungen mitgezählt, Tageswechsel 00:00). Erreicht → kein Google-
# Aufruf mehr bis Mitternacht, Aufnahme bleibt als WAV in %APPDATA%\KaiScribe\nicht_erkannt, rote Zeile. Normal sind
# 15–30 min/Tag. Zähler: %APPDATA%\KaiScribe\stt_tagesdeckel_<PC>.json. Standard 240 (4 h); 0/aus gibt es nicht.
# STT_TAGESDECKEL_MIN = 240
